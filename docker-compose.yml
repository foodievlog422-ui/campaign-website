services:
  web:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Without DATABASE_URL (in .env) the app uses this SQLite file.
      # With DATABASE_URL set, Postgres is used and the file/volume is unused.
      DB_PATH: /app/data/app.db
    volumes:
      - campaign-data:/app/data
    restart: unless-stopped
volumes:
  campaign-data:
